<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Scroll Screenshot</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Scroll Screenshot</h1>
  <p>Capture a partir da posição atual. Em apps como Discord, captura o painel de rolagem principal. Mantenha esta aba visível.</p>
  <label for="mode">Capturar</label>
  <select id="mode">
    <option value="end">Até o fim da página</option>
    <option value="pixels">Uma altura em pixels</option>
    <option value="screens">Uma quantidade de telas</option>
  </select>
  <div id="amount-row" hidden><label for="amount">Altura a capturar (inclui a tela atual)</label><input id="amount" type="number" min="1" step="1" value="2"></div>
  <button id="capture">Iniciar captura</button>
  <button id="stop" hidden>Parar e salvar (Esc)</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
